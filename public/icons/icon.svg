<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Cosmic Rounded Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="4"/>

  <!-- Glowing Prismatic Octahedron Crystal -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Back Glow Aura -->
    <circle r="140" fill="url(#prismGrad)" opacity="0.25"/>

    <!-- Top facet -->
    <polygon points="0,-150 -105,-20 0,-5" fill="#38bdf8" opacity="0.95"/>
    <polygon points="0,-150 105,-20 0,-5" fill="#818cf8" opacity="0.9"/>
    
    <!-- Left facet -->
    <polygon points="-105,-20 0,-5 -75,130" fill="#6366f1" opacity="0.85"/>
    
    <!-- Right facet -->
    <polygon points="105,-20 0,-5 75,130" fill="#a855f7" opacity="0.95"/>
    
    <!-- Bottom facet -->
    <polygon points="0,-5 -75,130 0,165" fill="#ec4899" opacity="0.9"/>
    <polygon points="0,-5 75,130 0,165" fill="#f43f5e" opacity="0.95"/>

    <!-- Light reflection highlight -->
    <polygon points="0,-140 -40,-40 0,-15" fill="#ffffff" opacity="0.45"/>
    <circle cx="0" cy="-20" r="14" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Crown Stars -->
  <circle cx="256" cy="65" r="8" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="120" cy="140" r="5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="392" cy="140" r="5" fill="#c084fc" opacity="0.8"/>
  <circle cx="90" cy="360" r="4" fill="#818cf8" opacity="0.6"/>
  <circle cx="420" cy="360" r="4" fill="#f43f5e" opacity="0.6"/>
</svg>
